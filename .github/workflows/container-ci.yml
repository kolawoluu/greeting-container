name: Container CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Proofctl
        run: python -m pip install --disable-pip-version-check proofctl==0.6.0

      - name: Scan repository with Proofctl
        run: proofctl check . --no-pypi --fail-on ERROR --strict

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install Markdown lint tools
        run: >-
          npm install --prefix "$GITHUB_WORKSPACE"
          --no-save --no-package-lock --ignore-scripts
          markdownlint-cli2@0.23.3
          markdownlint-cli2-formatter-default@0.0.6
          markdownlint-cli2-formatter-codequality@0.0.8

      - name: Lint Markdown with repository configuration
        run: |
          "$GITHUB_WORKSPACE/node_modules/.bin/markdownlint-cli2" "**/*.md" "#node_modules"
          git diff --exit-code

      - name: Lint Dockerfile
        run: docker run --rm -i hadolint/hadolint@sha256:27086352fd5e1907ea2b934eb1023f217c5ae087992eb59fde121dce9c9ff21e < Dockerfile

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build linux/amd64 image
        run: docker buildx build --load --platform linux/amd64 --build-arg VERSION=ci -t dwp-submission:ci-amd64 .

      - name: Build linux/arm64 image
        run: docker buildx build --load --platform linux/arm64 --build-arg VERSION=ci -t dwp-submission:ci-arm64 .

      - name: Check image user
        run: |
          test "$(docker image inspect dwp-submission:ci-amd64 --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect dwp-submission:ci-arm64 --format '{{.Config.User}}')" = "10001:10001"

      - name: Scan linux/amd64 image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: image
          image-ref: dwp-submission:ci-amd64
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: "false"

      - name: Fail on CRITICAL linux/amd64 vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: image
          image-ref: dwp-submission:ci-amd64
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

      - name: Scan linux/arm64 image
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: image
          image-ref: dwp-submission:ci-arm64
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: "false"

      - name: Fail on CRITICAL linux/arm64 vulnerabilities
        uses: aquasecurity/trivy-action@915b19bbe73b92a6cf82a1bc12b087c9a19a5fe2 # v0.28.0
        with:
          scan-type: image
          image-ref: dwp-submission:ci-arm64
          format: table
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: "false"

      - name: Smoke-test health endpoint
        run: |
          docker run --detach --rm --name dwp-submission-ci \
            --read-only --cap-drop ALL \
            --platform linux/amd64 --publish 127.0.0.1:8080:8080 dwp-submission:ci-amd64
          trap 'docker stop dwp-submission-ci >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            http://127.0.0.1:8080/healthz

      - name: Smoke-test arm64 health endpoint
        run: |
          docker run --detach --rm --name dwp-submission-ci-arm64 \
            --read-only --cap-drop ALL \
            --platform linux/arm64 --publish 127.0.0.1:8081:8080 dwp-submission:ci-arm64
          trap 'docker stop dwp-submission-ci-arm64 >/dev/null 2>&1 || true' EXIT
          curl --fail --silent --show-error --retry 20 --retry-connrefused \
            --retry-all-errors --retry-delay 2 --retry-max-time 60 \
            http://127.0.0.1:8081/healthz
